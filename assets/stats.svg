<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="5+ years of experience; 5 engineers directed; 10+ Qlik Sense dashboards shipped; CGPA 3.6 in BS Computer Science; MS Artificial Intelligence in progress">
<style>
.tile { opacity: 0; animation: rise .7s ease-out forwards; }
.bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: fill 1.1s ease-out forwards; }
