<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Kiran Khan, AI Lead and Data Scientist">
  <style>
    .name { opacity: 0; animation: rise .9s ease-out .2s forwards; }
    .rule { transform-origin: 72px 140px; transform: scaleX(0); animation: grow .8s ease-out .9s forwards; }
    .role { opacity: 0; animation: fade .8s ease-out 1.2s forwards; }
    .edge { stroke-dasharray: 5 9; animation: flow 1.6s linear infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }
    .d1 { animation-delay: .4s; } .d2 { animation-delay: .8s; } .d3 { animation-delay: 1.2s; }
    .d4 { animation-delay: 1.6s; } .d5 { animation-delay: 2s; } .d6 { animation-delay: 2.4s; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
    @media (prefers-reduced-motion: reduce) {
      .name, .role { opacity: 1; animation: none; }
      .rule { transform: none; animation: none; }
      .edge, .node { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#160F2A"/>
      <stop offset="1" stop-color="#2A1450"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F3FBF"/>
      <stop offset="1" stop-color="#F85D7F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#7F3FBF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7F3FBF" stop-opacity="0"/>
      <animate attributeName="r" values="0.40;0.50;0.40" dur="8s" repeatCount="indefinite"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- links between agents (also the routes the message packets follow) -->
    <path id="e1" d="M930 150 L830 80"/>
    <path id="e2" d="M930 150 L840 225"/>
    <path id="e3" d="M930 150 L1040 70"/>
    <path id="e4" d="M930 150 L1060 160"/>
    <path id="e5" d="M930 150 L1010 240"/>
    <path id="e6" d="M1040 70 L1120 110"/>
    <path id="e7" d="M1060 160 L1120 110"/>
    <path id="e8" d="M1060 160 L1140 215"/>
    <path id="e9" d="M1010 240 L1140 215"/>
    <path id="e10" d="M830 80 L760 130"/>
    <path id="e11" d="M840 225 L760 130"/>
    <!-- tagline wipes, one per line, each in its own quarter of a 16 s loop -->
    <clipPath id="t1"><rect x="68" y="210" height="32" width="0">
      <animate attributeName="width" values="0;720;720;0;0" keyTimes="0;0.09;0.23;0.25;1" dur="16s" begin="1.6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t2"><rect x="68" y="210" height="32" width="0">
      <animate attributeName="width" values="0;0;720;720;0;0" keyTimes="0;0.25;0.34;0.48;0.5;1" dur="16s" begin="1.6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t3"><rect x="68" y="210" height="32" width="0">
      <animate attributeName="width" values="0;0;720;720;0;0" keyTimes="0;0.5;0.59;0.73;0.75;1" dur="16s" begin="1.6s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="t4"><rect x="68" y="210" height="32" width="0">
      <animate attributeName="width" values="0;0;720;720;0" keyTimes="0;0.75;0.84;0.98;1" dur="16s" begin="1.6s" repeatCount="indefinite"/>
    </rect></clipPath>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#7F3FBF" stroke-opacity="0.55" stroke-width="2"/>

  <!-- agent network -->
  <g class="edge" stroke="#A675E0" stroke-opacity="0.5" stroke-width="1.6" fill="none">
    <use xlink:href="#e1"/><use xlink:href="#e2"/><use xlink:href="#e3"/><use xlink:href="#e4"/>
    <use xlink:href="#e5"/><use xlink:href="#e6"/><use xlink:href="#e7"/><use xlink:href="#e8"/>
    <use xlink:href="#e9"/><use xlink:href="#e10"/><use xlink:href="#e11"/>
  </g>

  <!-- messages travelling between agents -->
  <g fill="#F8D866">
    <circle r="3.5" filter="url(#soft)"><animateMotion dur="2.2s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#e3"/></animateMotion></circle>
    <circle r="3.5" filter="url(#soft)"><animateMotion dur="2.6s" repeatCount="indefinite" begin="0.7s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#e1"/></animateMotion></circle>
    <circle r="3.5" filter="url(#soft)"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.3s"><mpath xlink:href="#e4"/></animateMotion></circle>
    <circle r="3.5" filter="url(#soft)"><animateMotion dur="2.8s" repeatCount="indefinite" begin="0.4s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#e5"/></animateMotion></circle>
    <circle r="3" filter="url(#soft)"><animateMotion dur="1.9s" repeatCount="indefinite" begin="1.1s"><mpath xlink:href="#e8"/></animateMotion></circle>
    <circle r="3" filter="url(#soft)"><animateMotion dur="2.1s" repeatCount="indefinite" begin="0.2s"><mpath xlink:href="#e6"/></animateMotion></circle>
    <circle r="3" filter="url(#soft)"><animateMotion dur="2.3s" repeatCount="indefinite" begin="1.8s" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath xlink:href="#e11"/></animateMotion></circle>
  </g>

  <!-- agents -->
  <circle cx="930" cy="150" fill="none" stroke="#F85D7F" stroke-width="2">
    <animate attributeName="r" values="20;46" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="930" cy="150" r="17" fill="url(#accent)"/>
  <circle class="node d1" cx="830" cy="80" r="9" fill="#7F3FBF"/>
  <circle class="node d2" cx="840" cy="225" r="9" fill="#7F3FBF"/>
  <circle class="node d3" cx="1040" cy="70" r="10" fill="#A675E0"/>
  <circle class="node d4" cx="1060" cy="160" r="11" fill="#A675E0"/>
  <circle class="node d5" cx="1010" cy="240" r="9" fill="#A675E0"/>
  <circle class="node d6" cx="1120" cy="110" r="7" fill="#F8D866"/>
  <circle class="node d1" cx="1140" cy="215" r="7" fill="#F8D866"/>
  <circle class="node d4" cx="760" cy="130" r="6" fill="#F8D866"/>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text class="name" x="70" y="118" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Kiran Khan</text>
    <rect class="rule" x="72" y="138" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text class="role" x="70" y="190" font-size="28" font-weight="600" fill="#C9B6F2">AI Lead &amp; Data Scientist</text>
    <g font-size="20" fill="#8B949E">
      <text x="70" y="232" clip-path="url(#t1)">I build AI systems and analytics that businesses actually run on</text>
      <text x="70" y="232" clip-path="url(#t2)">Multi-agent LLM platforms · computer vision · predictive analytics</text>
      <text x="70" y="232" clip-path="url(#t3)">Role-scoped agents · grounded generation · multi-tenant control planes</text>
      <text x="70" y="232" clip-path="url(#t4)">MS Artificial Intelligence @ FAST-NUCES · Karachi, Pakistan</text>
    </g>
  </g>
</svg>
