<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Kiran Khan, AI Lead and Data Scientist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#160F2A"/>
      <stop offset="1" stop-color="#2A1450"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F3FBF"/>
      <stop offset="1" stop-color="#F85D7F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#7F3FBF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7F3FBF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="298" rx="15" fill="none" stroke="#7F3FBF" stroke-opacity="0.55" stroke-width="2"/>

  <!-- multi-agent network motif -->
  <g stroke="#A675E0" stroke-opacity="0.45" stroke-width="1.6" fill="none">
    <line x1="930" y1="150" x2="830" y2="80"/>
    <line x1="930" y1="150" x2="840" y2="225"/>
    <line x1="930" y1="150" x2="1040" y2="70"/>
    <line x1="930" y1="150" x2="1060" y2="160"/>
    <line x1="930" y1="150" x2="1010" y2="240"/>
    <line x1="1040" y1="70" x2="1120" y2="110"/>
    <line x1="1060" y1="160" x2="1120" y2="110"/>
    <line x1="1060" y1="160" x2="1140" y2="215"/>
    <line x1="1010" y1="240" x2="1140" y2="215"/>
    <line x1="830" y1="80" x2="760" y2="130"/>
    <line x1="840" y1="225" x2="760" y2="130"/>
  </g>
  <g>
    <circle cx="930" cy="150" r="17" fill="url(#accent)"/>
    <circle cx="930" cy="150" r="27" fill="none" stroke="#F85D7F" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="830" cy="80" r="9" fill="#7F3FBF"/>
    <circle cx="840" cy="225" r="9" fill="#7F3FBF"/>
    <circle cx="1040" cy="70" r="10" fill="#A675E0"/>
    <circle cx="1060" cy="160" r="11" fill="#A675E0"/>
    <circle cx="1010" cy="240" r="9" fill="#A675E0"/>
    <circle cx="1120" cy="110" r="7" fill="#F8D866"/>
    <circle cx="1140" cy="215" r="7" fill="#F8D866"/>
    <circle cx="760" cy="130" r="6" fill="#F8D866"/>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="70" y="118" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Kiran Khan</text>
    <rect x="72" y="138" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="70" y="190" font-size="28" font-weight="600" fill="#C9B6F2">AI Lead &amp; Data Scientist</text>
    <text x="70" y="232" font-size="20" fill="#8B949E">Multi-agent LLM platforms · computer vision · predictive analytics</text>
  </g>
</svg>
