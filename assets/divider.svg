<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="presentation">
  <style>
    @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
  </style>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F3FBF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#7F3FBF" stop-opacity="0.7"/>
      <stop offset="0.8" stop-color="#F85D7F" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F85D7F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#F8D866"/>
      <stop offset="1" stop-color="#F8D866" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#line)"/>
  <g fill="#A675E0" opacity="0.8">
    <circle cx="300" cy="12" r="3"/><circle cx="600" cy="12" r="4"/><circle cx="900" cy="12" r="3"/>
  </g>
  <circle class="pulse" cy="12" r="10" fill="url(#dot)">
    <animate attributeName="cx" values="-20;1220" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>
